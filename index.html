<!DOCTYPE html>
<html lang="en" data-theme="parchment">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Reading Sanctuary — Personal Book Notes & Marginalia</title>
  <meta name="description" content="A tactile, aesthetic digital reading journal styled like a physical hardcover book with 3D page-flip animations, quotes, stories, and personal marginalia.">
  <meta name="author" content="Shiwani">

  <!-- Stylesheets (All Relative Paths for Native GitHub Pages Hosting) -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/book.css">
  <link rel="stylesheet" href="./css/page-flip.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar & Ambient Header -->
  <header class="journal-header" id="journal-header">
    <div class="header-brand">
      <span class="brand-icon">❧</span>
      <h1 class="brand-title">The Reading Sanctuary</h1>
      <span class="brand-subtitle">Personal Notes, Quotes & Marginalia</span>
    </div>

    <div class="header-controls">
      <button class="ctrl-btn" id="btn-jump-toc" title="Jump to Table of Contents">
        <span class="icon">📜</span>
        <span class="label">Index</span>
      </button>

      <button class="ctrl-btn" id="btn-jump-bookmark" title="Jump to saved ribbon bookmark">
        <span class="icon">🔖</span>
        <span class="label">Bookmark</span>
      </button>

      <button class="ctrl-btn" id="sound-toggle-btn" title="Toggle page-turn paper rustle sound">
        <span class="icon">🔊</span>
        <span class="label">Sound</span>
      </button>

      <button class="ctrl-btn" id="theme-toggle-btn" title="Toggle Day Parchment / Midnight Library">
        <span class="icon">🌙</span>
        <span class="label">Midnight</span>
      </button>
    </div>
  </header>

  <!-- Ambient Desk Viewport -->
  <main class="desk-viewport" id="desk-viewport">
    <div id="book-container">
      <!-- The Book Casing and Pages are injected dynamically by PageFlipEngine -->
    </div>
  </main>

  <!-- Floating Bottom Reading Dock -->
  <nav class="reading-dock" id="reading-dock" aria-label="Book Navigation">
    <button class="dock-nav-btn" id="btn-prev-page" title="Turn page backward (← Arrow)">
      <span>←</span>
      <span class="dock-label">Previous</span>
    </button>

    <div class="spread-indicator-pill" id="spread-indicator">
      Cover
    </div>

    <button class="dock-nav-btn" id="btn-next-page" title="Turn page forward (→ Arrow or Space)">
      <span class="dock-label">Next</span>
      <span>→</span>
    </button>

    <span class="keyboard-hint" title="Use Arrow keys or Spacebar to flip">[ ← / → ]</span>
  </nav>

  <!-- Scripts (All Relative Paths for Native GitHub Pages Hosting) -->
  <script src="./js/audio.js"></script>
  <script src="./js/templates.js"></script>
  <script src="./js/page-flip-engine.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
